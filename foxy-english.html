<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fun English with Foxy</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A6%8A%3C/text%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
</head>
<body>
<a href="index.html" style="position:fixed;top:14px;right:14px;z-index:100;background:#fff;color:#2B2140;text-decoration:none;font-weight:700;font-size:14px;padding:8px 14px;border-radius:99px;box-shadow:0 2px 8px rgba(0,0,0,.15);font-family:-apple-system,'Segoe UI',system-ui,sans-serif;">⟵ למשחקים של שמואל</a>
<div class="app" id="app" dir="rtl" lang="he"></div>

<style>
:root{
  --bg: #FBF8FF;
  --card-bg: #FFFFFF;
  --ink: #2B2140;
  --ink-soft: #6B6280;
  --line: #E9E2F7;
  --shadow: 220 60% 20%;

  --c-animals: #FF6B6B;
  --c-colors:  #8E5CD9;
  --c-numbers: #4EA8DE;
  --c-fruits:  #43B65A;
  --c-family:  #FF6FA0;
  --c-food:    #F5A623;
  --c-clothes: #16A99A;
  --c-house:   #FF8A3D;

  --good: #34B26B;
  --bad: #E5484D;
}
:root[data-theme="dark"]{
  --bg: #1B1530;
  --card-bg: #261E42;
  --ink: #F4F0FF;
  --ink-soft: #B7ACD6;
  --line: #3A2F5C;
  --shadow: 260 60% 3%;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg: #1B1530;
    --card-bg: #261E42;
    --ink: #F4F0FF;
    --ink-soft: #B7ACD6;
    --line: #3A2F5C;
    --shadow: 260 60% 3%;
  }
}

*{ box-sizing:border-box; }
.app{
  min-height:100%;
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, "Segoe UI", system-ui, "Arial Hebrew", sans-serif;
  padding: 28px 20px 40px;
  display:flex;
  flex-direction:column;
  align-items:center;
  overflow-x:hidden;
}
.app *{ text-wrap: balance; }

/* ---------- HOME ---------- */
.home{ width:100%; max-width:780px; display:flex; flex-direction:column; align-items:center; gap:6px; }
.mascot{ font-size:64px; line-height:1; filter: drop-shadow(0 6px 10px hsl(var(--shadow) / .25)); animation: bob 3.2s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce){ .mascot{ animation:none; } }
@keyframes bob{ 0%,100%{ transform: translateY(0) rotate(-2deg);} 50%{ transform: translateY(-8px) rotate(2deg);} }
h1.title{ font-size: clamp(28px,5vw,38px); font-weight:800; margin: 4px 0 0; letter-spacing:-0.01em; }
p.subtitle{ color: var(--ink-soft); font-size:16px; margin: 0 0 18px; }

.mode-tabs{ display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin:2px 0 18px; background: var(--card-bg); padding:5px; border-radius:16px; box-shadow: inset 0 0 0 1.5px var(--line); }
.mode-tab{
  border:none; background:transparent; color: var(--ink-soft); cursor:pointer;
  font-family:inherit; font-weight:800; font-size:15px; padding:9px 18px; border-radius:12px;
}
.mode-tab.on{ background: var(--c-family); color:#fff; }

.grid{ width:100%; display:grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap:14px; }
.cat-card{
  --c: var(--c-animals);
  position:relative;
  border:none; cursor:pointer;
  border-radius: 22px;
  padding: 20px 14px 16px;
  background: color-mix(in srgb, var(--c) 14%, var(--card-bg));
  box-shadow: 0 2px 0 hsl(var(--shadow) / .06), inset 0 0 0 2px color-mix(in srgb, var(--c) 35%, transparent);
  display:flex; flex-direction:column; align-items:center; gap:8px;
  transition: transform .12s ease, box-shadow .12s ease;
  font-family:inherit;
}
.cat-card:hover{ transform: translateY(-3px); box-shadow: 0 8px 16px hsl(var(--shadow) / .18), inset 0 0 0 2px var(--c); }
.cat-card:active{ transform: translateY(0) scale(.98); }
.cat-card:focus-visible{ outline: 3px solid var(--c); outline-offset:3px; }
.cat-emoji{ font-size: 38px; }
.cat-label{ font-weight:700; font-size:16px; color: var(--ink); }
.cat-dot{ width:8px; height:8px; border-radius:50%; background:var(--c); }

.mix-card{
  grid-column: 1 / -1;
  background: linear-gradient(120deg,
    color-mix(in srgb, var(--c-animals) 20%, var(--card-bg)),
    color-mix(in srgb, var(--c-numbers) 20%, var(--card-bg)),
    color-mix(in srgb, var(--c-fruits) 20%, var(--card-bg)),
    color-mix(in srgb, var(--c-family) 20%, var(--card-bg)));
  flex-direction:row; justify-content:center; padding:18px;
  box-shadow: 0 2px 0 hsl(var(--shadow) / .06), inset 0 0 0 2px var(--line);
}
.mix-card:hover{ box-shadow: 0 8px 16px hsl(var(--shadow) / .18), inset 0 0 0 2px var(--c-family); }
.mix-card .cat-emoji{ font-size:30px; }

/* ---------- QUIZ ---------- */
.quiz{ width:100%; max-width:520px; display:flex; flex-direction:column; gap:18px; }
.quiz-top{ display:flex; align-items:center; gap:12px; }
.icon-btn{
  border:none; background: var(--card-bg); color:var(--ink-soft);
  width:38px; height:38px; border-radius:12px; font-size:18px; cursor:pointer;
  box-shadow: inset 0 0 0 1.5px var(--line);
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.icon-btn:hover{ color: var(--ink); }

.back-pill{
  border:none; background: var(--card-bg); color:var(--ink-soft);
  height:38px; padding:0 16px 0 14px; border-radius:99px; font-size:14px; font-weight:700; cursor:pointer;
  box-shadow: inset 0 0 0 1.5px var(--line);
  display:flex; align-items:center; gap:6px; flex-shrink:0;
  font-family:inherit;
}
.back-pill:hover{ color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink-soft); }

.bank-link{
  border:none; background: var(--card-bg); color:var(--ink-soft);
  padding:12px 18px; border-radius:16px; font-size:15px; font-weight:700; cursor:pointer;
  box-shadow: inset 0 0 0 2px var(--line);
  display:flex; align-items:center; gap:8px; margin-top:16px;
  font-family:inherit;
}
.bank-link:hover{ color:var(--ink); box-shadow: inset 0 0 0 2px var(--c-family); }

/* ---------- BANK ---------- */
.bank{ width:100%; max-width:640px; display:flex; flex-direction:column; gap:16px; }
.chips{ display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; }
.chip{
  flex-shrink:0; border:none; background: var(--card-bg); color:var(--ink-soft);
  padding:8px 16px; border-radius:99px; font-size:14px; font-weight:700; cursor:pointer;
  box-shadow: inset 0 0 0 1.5px var(--line); font-family:inherit;
}
.chip.on{ color:var(--ink); box-shadow: inset 0 0 0 2px var(--c-family); }
.bank-cat-head{ display:flex; align-items:center; gap:8px; font-weight:800; font-size:15px; margin:14px 0 6px; color:var(--ink); }
.word-row{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:10px 6px; border-bottom:1px solid var(--line); font-size:16px;
}
.word-row .w-he{ display:flex; align-items:center; gap:8px; }
.word-row .w-en{ color: var(--ink-soft); font-weight:700; }

.add-box{
  background: var(--card-bg); border-radius:20px; padding:18px 16px;
  box-shadow: inset 0 0 0 2px var(--line);
}
.add-title{ font-weight:800; font-size:15px; margin-bottom:12px; display:flex; align-items:center; gap:6px; }
.add-form{ display:flex; flex-wrap:wrap; gap:8px; }
.field-input{
  height:40px; border-radius:12px; border:none; padding:0 12px;
  box-shadow: inset 0 0 0 1.5px var(--line); font-family:inherit; font-size:14px;
  background: var(--bg); color: var(--ink);
}
.field-input:focus{ outline:none; box-shadow: inset 0 0 0 2px var(--c-family); }
.field-emoji{ width:54px; text-align:center; }
.field-he, .field-en{ flex:1; min-width:110px; }
.add-btn{
  height:40px; padding:0 18px; border-radius:12px; border:none; cursor:pointer;
  background: var(--c-family); color:#fff; font-weight:800; font-size:14px; font-family:inherit;
}
.add-btn:active{ transform: scale(.97); }
.new-cat-box{ display:none; flex-wrap:wrap; gap:8px; width:100%; margin-top:4px; padding-top:10px; box-shadow: inset 0 1px 0 var(--line); }
.new-cat-box.show{ display:flex; }
.field-catname{ flex:1; min-width:140px; }
.form-msg{ font-size:13px; font-weight:700; margin-top:8px; min-height:16px; }
.form-msg.ok{ color: var(--good); }
.form-msg.warn{ color: #C97A16; }
.progress-track{ flex:1; height:10px; background: var(--line); border-radius:99px; overflow:hidden; }
.progress-fill{ height:100%; border-radius:99px; background: var(--cat-color, var(--c-animals)); transition: width .35s ease; }
.stars-count{ font-weight:700; font-size:15px; white-space:nowrap; display:flex; align-items:center; gap:4px; }

.q-card{
  background: var(--card-bg);
  border-radius: 26px;
  padding: 38px 20px 30px;
  text-align:center;
  box-shadow: 0 4px 0 hsl(var(--shadow) / .06), inset 0 0 0 2px var(--line);
  display:flex; flex-direction:column; align-items:center; gap:10px;
}
.q-emoji{ font-size: 72px; line-height:1; }
.q-word{ font-size:26px; font-weight:800; }
.q-hint{ color:var(--ink-soft); font-size:14px; }

.answers{ display:grid; grid-template-columns: 1fr 1fr; gap:12px; }
.ans-btn{
  font-family:inherit;
  font-size:18px; font-weight:700;
  padding:18px 10px;
  border-radius:18px;
  border:none;
  background: var(--card-bg);
  color: var(--ink);
  box-shadow: 0 3px 0 hsl(var(--shadow) / .1), inset 0 0 0 2px var(--line);
  cursor:pointer;
  transition: transform .08s ease, box-shadow .12s ease, background .12s ease;
}
.ans-btn:hover:not(:disabled){ box-shadow: 0 3px 0 hsl(var(--shadow) / .1), inset 0 0 0 2px var(--cat-color, var(--c-animals)); }
.ans-btn:active:not(:disabled){ transform: translateY(2px); }
.ans-btn:focus-visible{ outline: 3px solid var(--cat-color, var(--c-animals)); outline-offset:2px; }
.ans-btn.correct{ background: color-mix(in srgb, var(--good) 20%, var(--card-bg)); box-shadow: inset 0 0 0 2px var(--good); }
.ans-btn.wrong{ background: color-mix(in srgb, var(--bad) 16%, var(--card-bg)); box-shadow: inset 0 0 0 2px var(--bad); animation: shake .35s ease; }
.ans-btn:disabled{ cursor:default; opacity:.85; }
@keyframes shake{ 0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 75%{transform:translateX(6px);} }
@media (prefers-reduced-motion: reduce){ .ans-btn.wrong{ animation:none; } }

.feedback{ min-height: 26px; text-align:center; font-weight:700; font-size:15px; }
.feedback.good{ color: var(--good); }
.feedback.bad{ color: var(--bad); }

/* ---------- ALPHABET (A-Z learner) ---------- */
.alphabet{ width:100%; max-width:560px; display:flex; flex-direction:column; gap:16px; }
.alpha-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(64px,1fr)); gap:10px; direction:ltr; }
.alpha-tile{
  display:flex; flex-direction:column; align-items:center; gap:6px;
  background: var(--card-bg); border-radius:16px; padding:12px 4px 10px;
  box-shadow: inset 0 0 0 2px var(--line);
  transition: box-shadow .15s ease, background .15s ease;
}
.alpha-tile.known{ box-shadow: inset 0 0 0 2px var(--good); background: color-mix(in srgb, var(--good) 14%, var(--card-bg)); }
.alpha-letter-btn{
  font-family:inherit; font-weight:800; font-size:24px; border:none; background:transparent;
  color: var(--ink); cursor:pointer; width:100%; padding:2px 0;
}
.alpha-letter-btn:active{ transform: scale(.9); }
.alpha-known-btn{
  border:none; border-radius:99px; width:26px; height:26px; cursor:pointer; font-size:13px;
  display:flex; align-items:center; justify-content:center;
  background: var(--line); color: var(--ink-soft); font-weight:800;
}
.alpha-tile.known .alpha-known-btn{ background: var(--good); color:#fff; }

/* ---------- LETTERS (per-word spelling) ---------- */
.letters{ width:100%; max-width:520px; display:flex; flex-direction:column; gap:18px; }
.letter-tiles{ display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin:10px 0 4px; direction:ltr; }
.letter-tile{
  font-family:inherit; font-weight:800; font-size:22px;
  width:46px; height:46px; border-radius:14px; border:none; cursor:pointer;
  background: var(--card-bg); color: var(--ink);
  box-shadow: 0 3px 0 hsl(var(--shadow) / .1), inset 0 0 0 2px var(--line);
  transition: transform .08s ease, box-shadow .12s ease, background .12s ease;
}
.letter-tile:hover{ box-shadow: 0 3px 0 hsl(var(--shadow) / .1), inset 0 0 0 2px var(--cat-color, var(--c-animals)); }
.letter-tile:active, .letter-tile.active{ transform: translateY(2px) scale(1.05); background: color-mix(in srgb, var(--cat-color, var(--c-animals)) 22%, var(--card-bg)); box-shadow: inset 0 0 0 2px var(--cat-color, var(--c-animals)); }
.letter-gap{ width:14px; }
.letter-actions{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:10px; }
.letter-nav{ display:flex; gap:10px; }
.letter-nav .btn{ flex:1; }

/* ---------- FLASHCARDS (Quizlet-style) ---------- */
.flashcards{ width:100%; max-width:520px; display:flex; flex-direction:column; gap:18px; }
.flash-card{ min-height:220px; justify-content:center; }
.flash-actions{ display:flex; gap:10px; }
.flash-actions .btn{ flex:1; }
.flash-learn{ background: color-mix(in srgb, var(--bad) 16%, var(--card-bg)); color: var(--bad); box-shadow: inset 0 0 0 2px var(--bad); }
.flash-know{ background: color-mix(in srgb, var(--good) 20%, var(--card-bg)); color: var(--good); box-shadow: inset 0 0 0 2px var(--good); }

/* ---------- MEMORY ---------- */
.memory{ width:100%; max-width:560px; display:flex; flex-direction:column; gap:16px; }
.mem-meta{ font-weight:700; font-size:14px; color: var(--ink-soft); white-space:nowrap; }
.mem-grid{ display:grid; grid-template-columns: repeat(4, 1fr); gap:10px; }
.mem-card{
  aspect-ratio: 1 / 1; border:none; border-radius:16px; cursor:pointer;
  background: var(--card-bg); box-shadow: inset 0 0 0 2px var(--line);
  display:flex; align-items:center; justify-content:center; text-align:center;
  font-family:inherit; padding:4px; overflow:hidden;
  transition: transform .15s ease, box-shadow .15s ease;
}
.mem-card:hover:not(.flipped):not(.matched){ box-shadow: inset 0 0 0 2px var(--cat-color, var(--c-animals)); }
.mem-card .mem-back{ font-size:26px; opacity:.55; }
.mem-card.flipped, .mem-card.matched{ background: color-mix(in srgb, var(--cat-color, var(--c-animals)) 14%, var(--card-bg)); box-shadow: inset 0 0 0 2px var(--cat-color, var(--c-animals)); }
.mem-card.matched{ background: color-mix(in srgb, var(--good) 18%, var(--card-bg)); box-shadow: inset 0 0 0 2px var(--good); cursor:default; }
.mem-card .mem-pic{ font-size:26px; line-height:1; }
.mem-card .mem-he{ font-size:12px; font-weight:700; margin-top:2px; }
.mem-card .mem-en{ font-size:15px; font-weight:800; }
@media (prefers-reduced-motion: no-preference){ .mem-card.flipped{ animation: pop .18s ease; } }
@keyframes pop{ 0%{ transform:scale(.85); } 100%{ transform:scale(1); } }

/* ---------- COASTER (bonus mini-game) ---------- */
.coaster{ width:100%; max-width:720px; display:flex; flex-direction:column; align-items:center; gap:14px; }
.coaster-canvas{
  width:100%; height:auto; display:block; border-radius:22px;
  box-shadow: 0 4px 0 hsl(var(--shadow) / .06), inset 0 0 0 2px var(--line);
  touch-action:none;
}
.coaster-input-row{ display:flex; gap:8px; }
.coaster-input{ flex:1; height:46px; font-size:18px; text-align:center; }
.coaster-check-btn{
  height:46px; padding:0 22px; border-radius:12px; border:none; cursor:pointer;
  background: var(--cat-color, var(--c-house)); color:#fff; font-weight:800; font-size:16px; font-family:inherit;
}
.coaster-check-btn:active{ transform: scale(.97); }
.coaster-canvas-wrap{ position:relative; width:100%; }
.coaster-hud{
  position:absolute; top:0; left:0; z-index:5; direction:ltr;
  width:42%; min-width:200px; max-width:320px;
  border-radius: 0 0 20px 0; overflow:hidden;
  box-shadow: 0 4px 14px rgba(0,0,0,.28);
}
.coaster-hud-top{
  background: rgba(35,35,40,.55);
  padding:8px 12px; display:flex; align-items:center; justify-content:flex-end;
}
.coaster-hud-speaker{
  border:none; background: rgba(255,255,255,.18); color:#fff;
  width:32px; height:32px; border-radius:50%; font-size:15px; cursor:pointer;
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.coaster-hud-speaker:hover{ background: rgba(255,255,255,.3); }
.coaster-hud-speaker:active{ transform: scale(.92); }
.coaster-hud-wordbar{
  background: rgba(224,224,224,.92);
  padding:14px 12px; text-align:center;
}
.coaster-hud-word{ font-size:26px; font-weight:800; color:#8B1E1E; }
.coaster-nav-hud{ position:absolute; top:14px; right:14px; z-index:5; display:flex; flex-direction:column; gap:8px; align-items:flex-end; }
.coaster-nav-btn{
  border:none; background:#FCE38A; color:#5C4A0E; font-weight:700; font-size:13px;
  padding:8px 14px; border-radius:99px; cursor:pointer; white-space:nowrap;
  box-shadow: 0 2px 6px rgba(0,0,0,.2); font-family:inherit;
}
.coaster-nav-btn:active{ transform: scale(.96); }
.coaster-help-pop{
  position:absolute; top:60px; right:14px; z-index:6; max-width:220px;
  background:#fff; color:#2B2140; font-size:13px; font-weight:600; line-height:1.5;
  padding:12px 14px; border-radius:14px; box-shadow:0 6px 16px rgba(0,0,0,.22);
  display:none; text-align:right;
}
.coaster-help-pop.show{ display:block; }

/* ---------- RESULT ---------- */
.result{ width:100%; max-width:480px; display:flex; flex-direction:column; align-items:center; gap:14px; text-align:center; }
.result-emoji{ font-size:64px; }
.result-score{ font-size:44px; font-weight:800; font-variant-numeric: tabular-nums; }
.result-msg{ color: var(--ink-soft); font-size:17px; margin-bottom:8px; }
.result-actions{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
.btn{
  font-family:inherit; font-weight:700; font-size:16px;
  padding:14px 22px; border-radius:16px; border:none; cursor:pointer;
  transition: transform .08s ease;
}
.btn:active{ transform: scale(.97); }
.btn-primary{ background: var(--cat-color, var(--c-animals)); color:#fff; }
.btn-ghost{ background: var(--card-bg); color:var(--ink); box-shadow: inset 0 0 0 2px var(--line); }

/* particles */
.particle{
  position:fixed; top:0; left:0; pointer-events:none; font-size:22px; z-index:50;
  animation: pop-fly 900ms ease-out forwards;
}
@keyframes pop-fly{
  0%{ transform: translate(0,0) scale(.6) rotate(0deg); opacity:1; }
  100%{ transform: var(--fly-to) scale(1.1) rotate(var(--fly-rot)); opacity:0; }
}
@media (prefers-reduced-motion: reduce){ .particle{ display:none; } }

.sr-only{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
</style>

<script>
(function(){
  document.documentElement.lang = "he";
  document.documentElement.dir = "rtl";

  var CATS = [
    { id:"animals", label:"חיות",    icon:"🐶", color:"var(--c-animals)", hex:0xFF6B6B, words:[
      {e:"🐶",he:"כלב",en:"dog"},{e:"🐱",he:"חתול",en:"cat"},{e:"🐭",he:"עכבר",en:"mouse"},
      {e:"🐰",he:"ארנב",en:"rabbit"},{e:"🦊",he:"שועל",en:"fox"},{e:"🐻",he:"דוב",en:"bear"},
      {e:"🦁",he:"אריה",en:"lion"},{e:"🐘",he:"פיל",en:"elephant"},{e:"🐸",he:"צפרדע",en:"frog"},{e:"🐟",he:"דג",en:"fish"}
    ]},
    { id:"colors", label:"צבעים",   icon:"🎨", color:"var(--c-colors)", hex:0x8E5CD9, words:[
      {e:"🔴",he:"אדום",en:"red"},{e:"🟠",he:"כתום",en:"orange"},{e:"🟡",he:"צהוב",en:"yellow"},
      {e:"🟢",he:"ירוק",en:"green"},{e:"🔵",he:"כחול",en:"blue"},{e:"🟣",he:"סגול",en:"purple"},
      {e:"⚪",he:"לבן",en:"white"},{e:"⚫",he:"שחור",en:"black"},{e:"🟤",he:"חום",en:"brown"},{e:"🩷",he:"ורוד",en:"pink"}
    ]},
    { id:"numbers", label:"מספרים", icon:"🔢", color:"var(--c-numbers)", hex:0x4EA8DE, words:[

  function spellOut(word){
    try{
      if(!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      var letters = word.replace(/ /g,"").split("");
      var i = 0;
      function next(){
        if(i >= letters.length){
          setTimeout(function(){ speak(word); }, 250);
          return;
        }
        var u = new SpeechSynthesisUtterance(letters[i]);
        u.lang = "en-US";
        u.rate = 0.8;
        u.onend = function(){ i++; setTimeout(next, 150); };
        window.speechSynthesis.speak(u);

  function startRound(cat){
    var isMix = cat.id === "mix";
    var pool = isMix ? allWords() : cat.words;
    var n = Math.min(ROUND_LEN, pool.length);
    var qs = pick(pool, n).map(function(w){
      var distractPool = (isMix ? allWords() : cat.words).filter(function(x){ return x.en !== w.en; });
      var opts = [w];
      var seen = { }; seen[w.en] = true;
      shuffle(distractPool).forEach(function(d){
        if(opts.length >= 4) return;
        if(seen[d.en]) return;
        seen[d.en] = true;
        opts.push(d);
      });
      return { word:w, options: shuffle(opts) };
    });
    state = {
      screen:"quiz", cat:cat, questions: qs, index:0, stars:0,
      answered:false, wrongPicked:null
    };
    render();
  }

  function answer(opt){
    if(state.answered) return;
    var q = state.questions[state.index];
    var correct = opt.en === q.word.en;
    state.answered = true;
    if(correct){
      state.stars++;
      spawnParticles();
    } else {
      state.wrongPicked = opt.en;
    }
    render();
    setTimeout(function(){
      if(state.index + 1 < state.questions.length){
        state.index++;
        state.answered = false;
        state.wrongPicked = null;
        render();
      } else {
        state.screen = "result";
        render();
      }
    }, correct ? 850 : 1400);
  }

    var RIDER_EMOJI = ["🦖","🐵","🦄","🐸","🐙","🦕","🐲"];
    var RIDER_COUNT = 4, RIDER_GAP = 7;
    var riderSprites = [];
    for(var rci=0; rci<RIDER_COUNT; rci++){
      var rspr = makeEmojiSprite(RIDER_EMOJI[Math.floor(Math.random()*RIDER_EMOJI.length)], 4);
      scene.add(rspr);
      riderSprites.push(rspr);
    }
    function trackPointAt(worldX){
      var u = Math.max(0, Math.min(1, worldX/trackLength));
      return curve.getPointAt(u);
    }

    function placeCart(worldX){
      var u = Math.max(0, Math.min(1, worldX/trackLength));
      var pos = curve.getPointAt(u);
      var tangent = curve.getTangentAt(u).normalize();
      var side = new THREE.Vector3().crossVectors(tangent, new THREE.Vector3(0,1,0)).normalize();
      cart.position.copy(pos).add(new THREE.Vector3(0, 1.8, 0));
      var camPos = pos.clone()
        .add(new THREE.Vector3(0, 7, 0))
        .sub(tangent.clone().multiplyScalar(17))
        .add(side.clone().multiplyScalar(6));
      camera.position.copy(camPos);
      camera.lookAt(pos.clone().add(tangent.clone().multiplyScalar(16)).add(new THREE.Vector3(0, 1.2, 0)));
    }
    function placeRiders(worldX){
      riderSprites.forEach(function(rs, i){
        var rx = Math.max(0, worldX - RIDER_GAP*(i+1));
        var rpos = trackPointAt(rx);
        rs.position.copy(rpos).add(new THREE.Vector3(0, 1.7, 0));
      });
    }
    function draw(worldX){
      placeCart(worldX);
      placeRiders(worldX);
      sky.position.copy(camera.position);
      renderer.render(scene, camera);
    }
    draw(state.worldX);

    var card = el("div","q-card");
    card.appendChild(el("div","q-emoji", q.e));
    card.appendChild(el("div","q-word", q.he));
    card.appendChild(el("div","q-hint","כתבי את המילה באנגלית כדי לטפס!"));
    wrap.appendChild(card);

    var row = el("div","coaster-input-row");
    var input = document.createElement("input");
    input.type = "text";
    input.className = "field-input coaster-input";
    input.dir = "ltr";
    input.autocomplete = "off";
    input.autocapitalize = "off";
    input.spellcheck = false;
    var checkBtn = el("button","coaster-check-btn","טפסי! 🎢");
    row.appendChild(input); row.appendChild(checkBtn);
    wrap.appendChild(row);

    var fb = el("div","feedback");
    wrap.appendChild(fb);

    function doCheck(){
      var typed = input.value.trim();
      if(!typed) return;
      input.disabled = true;
      checkBtn.disabled = true;
      if(typed.toLowerCase() === q.en.toLowerCase()){
        fb.className = "feedback good";
        fb.textContent = ENCOURAGE_GOOD[Math.floor(Math.random()*ENCOURAGE_GOOD.length)];
        spawnParticles();
        var fromX = state.worldX, toX = state.worldX + 90, start = null, advanced = false;
        function playFinaleLoop(){
          var loopFrom = state.worldX, loopTo = trackLength, start2 = null, DURATION = 5200;
          function loopStep(ts){
            if(!start2) start2 = ts;
            var t2 = Math.min(1, (ts-start2)/DURATION);
            var eased2 = t2 < 0.5 ? 2*t2*t2 : 1 - Math.pow(-2*t2+2, 2)/2;
            draw(loopFrom + (loopTo-loopFrom)*eased2);
            if(t2 < 1){ coasterAnimId = requestAnimationFrame(loopStep); }
            else {
              stopCoasterAnim();
              state.worldX = trackLength;
              state.screen = "coasterResult";
              render();
            }
          }
          coasterAnimId = requestAnimationFrame(loopStep);
        }
        function advance(){
          if(advanced) return;
          advanced = true;
          state.worldX = toX;
          state.index++;
          state.correctCount++;
          if(state.index >= state.words.length){
            fb.className = "feedback good";
            fb.textContent = "🎉 סיבוב ניצחון! 🎢";
            row.style.display = "none";
            playFinaleLoop();
          } else {
            stopCoasterAnim();
            render();
          }
        }
        function step(ts){
          if(!start) start = ts;
          var t = Math.min(1, (ts-start)/700);
          var eased = 1 - Math.pow(1-t, 3);
          draw(fromX + (toX-fromX)*eased);
          if(t < 1){ coasterAnimId = requestAnimationFrame(step); }
          else advance();
        }
        coasterAnimId = requestAnimationFrame(step);
        setTimeout(advance, 750);
      } else {
        fb.className = "feedback bad";
        fb.textContent = "לא בדיוק... התשובה הנכונה: " + q.en;
        setTimeout(function(){
          input.disabled = false;
          checkBtn.disabled = false;
          input.value = "";
          input.focus();
          fb.textContent = "";
          fb.className = "feedback";
        }, 1400);
      }
    }
    checkBtn.addEventListener("click", doCheck);
    input.addEventListener("keydown", function(e){ if(e.key === "Enter") doCheck(); });

    return wrap;
  }

  var MEM_PAIRS = 6;

  function startMemory(cat){
    var pool = pick(cat.words, Math.min(MEM_PAIRS, cat.words.length));
    var cards = [];
    pool.forEach(function(w, i){
      cards.push({ id:i, type:"pic",  w:w });
      cards.push({ id:i, type:"word", w:w });
    });
    cards = shuffle(cards);
    state = {
      screen:"memory", cat:cat, cards:cards, flipped:[], matched:{}, moves:0, busy:false
    };
    render();
  }

  function flipCard(idx){
    if(state.busy) return;
    var c = state.cards[idx];
    if(state.matched[c.id] !== undefined) return;
    if(state.flipped.indexOf(idx) !== -1) return;
    if(state.flipped.length >= 2) return;

    state.flipped.push(idx);
    if(state.flipped.length < 2){
      render();
      return;
    }

    state.moves++;
    var a = state.cards[state.flipped[0]], b = state.cards[state.flipped[1]];
    if(a.id === b.id){
      state.matched[a.id] = true;
      render();
      spawnParticles();
      var totalPairs = state.cards.length / 2;
      if(Object.keys(state.matched).length === totalPairs){
        setTimeout(function(){ state.screen = "memoryResult"; render(); }, 500);
      } else {
        state.flipped = [];
      }
    } else {
      state.busy = true;
      render();
      setTimeout(function(){
        state.flipped = [];
        state.busy = false;
        render();
      }, 900);
    }
  }

      card.appendChild(el("div","q-hint", w.he));
      var speakBtn = el("button","btn btn-ghost","🔊 השמעה");
      speakBtn.addEventListener("click", function(){ speak(w.en); });
      card.appendChild(speakBtn);
    }
    wrap.appendChild(card);

    if(state.flipped){
      var actions = el("div","flash-actions");
      var learnBtn = el("button","btn flash-learn","❌ עוד לומדת");
      learnBtn.addEventListener("click", function(){ flashcardAnswer(false); });
      var knowBtn = el("button","btn flash-know","✅ ידעתי!");
      knowBtn.addEventListener("click", function(){ flashcardAnswer(true); });
      actions.appendChild(learnBtn); actions.appendChild(knowBtn);
      wrap.appendChild(actions);
    }

    return wrap;
  }

  function renderFlashcardsResult(){
    var wrap = el("div","result");
    wrap.style.setProperty("--cat-color", state.cat.color || "var(--c-animals)");
    wrap.appendChild(el("div","result-emoji","🏆"));
    wrap.appendChild(el("div","result-score", state.total + " / " + state.total + " 🗂️"));
    wrap.appendChild(el("div","result-msg","כל הכבוד! עברת על כל הכרטיסיות וידעת את כולן!"));
    var actions = el("div","result-actions");
    var again = el("button","btn btn-primary","שחקי שוב באותו נושא");
    again.addEventListener("click", function(){ startFlashcards(state.cat); });
    var home = el("button","btn btn-ghost","לתפריט הראשי");
    home.addEventListener("click", goHome);
    actions.appendChild(again); actions.appendChild(home);
    wrap.appendChild(actions);
    return wrap;
  }

  function renderMemory(){
    var wrap = el("div","memory");
    wrap.style.setProperty("--cat-color", state.cat.color || "var(--c-animals)");

    var top = el("div","quiz-top");
    var back = el("button","back-pill","⟵ לתפריט");
    back.addEventListener("click", goHome);
    var totalPairs = state.cards.length / 2;
    var matchedCount = Object.keys(state.matched).length;
    var track = el("div","progress-track");
    var fill = el("div","progress-fill");
    fill.style.width = Math.round((matchedCount/totalPairs)*100) + "%";
    track.appendChild(fill);
    var meta = el("div","mem-meta", "🔎 " + matchedCount + "/" + totalPairs + " · מעברים " + state.moves);
    top.appendChild(back); top.appendChild(track); top.appendChild(meta);
    wrap.appendChild(top);

    var grid = el("div","mem-grid");
    state.cards.forEach(function(c, idx){
      var isMatched = state.matched[c.id] !== undefined;
      var isFlipped = state.flipped.indexOf(idx) !== -1;
      var card = el("button","mem-card" + (isMatched ? " matched" : isFlipped ? " flipped" : ""));
      if(isMatched || isFlipped){
        if(c.type === "pic"){
          card.innerHTML = '<div><div class="mem-pic">'+c.w.e+'</div><div class="mem-he">'+c.w.he+'</div></div>';
        } else {
          card.innerHTML = '<div class="mem-en">'+c.w.en+'</div>';
        }
      } else {
        card.innerHTML = '<span class="mem-back">🐾</span>';
      }
      card.addEventListener("click", function(){ flipCard(idx); });
      grid.appendChild(card);
    });
    wrap.appendChild(grid);

    return wrap;
  }

  function renderMemoryResult(){
    var wrap = el("div","result");
    wrap.style.setProperty("--cat-color", state.cat.color || "var(--c-animals)");
    var totalPairs = state.cards.length / 2;
    var ratio = state.moves / totalPairs;
    var emoji = ratio <= 1.3 ? "🏆" : ratio <= 2 ? "🎉" : "🦊";
    var msg = ratio <= 1.3 ? "זיכרון מדהים! מצאת הכל כמעט בלי טעויות!" :
              ratio <= 2 ? "כל הכבוד! מצאת את כל הזוגות!" :
              "יפה! מצאת את כל הזוגות, ננסה שוב מהר יותר?";
    wrap.appendChild(el("div","result-emoji", emoji));
    wrap.appendChild(el("div","result-score", totalPairs + " / " + totalPairs + " 🧩"));
    wrap.appendChild(el("div","result-msg", msg + " (" + state.moves + " מעברים)"));
    var actions = el("div","result-actions");
    var again = el("button","btn btn-primary","שחקי שוב באותו נושא");
    again.addEventListener("click", function(){ startMemory(state.cat); });
    var home = el("button","btn btn-ghost","לתפריט הראשי");
    home.addEventListener("click", goHome);
    actions.appendChild(again); actions.appendChild(home);
    wrap.appendChild(actions);
    return wrap;
  }

  function renderResult(){
    var wrap = el("div","result");
    wrap.style.setProperty("--cat-color", state.cat.color || "var(--c-animals)");
    var total = state.questions.length;
    var s = state.stars;
    var emoji = s === total ? "🏆" : s >= total*0.7 ? "🎉" : s >= total*0.4 ? "🙂" : "🦊";
    var msg = s === total ? "מדהים! את אלופת האנגלית!" :
              s >= total*0.7 ? "כל הכבוד! את משתפרת מעולה!" :
              s >= total*0.4 ? "יופי, תמשיכי להתאמן!" :
              "יפה שניסית! בואי ננסה שוב, את תצליחי!";
    wrap.appendChild(el("div","result-emoji", emoji));
    wrap.appendChild(el("div","result-score", s + " / " + total + " ⭐"));
    wrap.appendChild(el("div","result-msg", msg));
    var actions = el("div","result-actions");
    var again = el("button","btn btn-primary","שחקי שוב באותו נושא");
    again.addEventListener("click", function(){ startRound(state.cat.id === "mix" ? {id:"mix", label:state.cat.label, color:state.cat.color} : CATS.filter(function(c){return c.id===state.cat.id;})[0]); });
    var home = el("button","btn btn-ghost","לתפריט הראשי");
    home.addEventListener("click", goHome);
    actions.appendChild(again); actions.appendChild(home);
    wrap.appendChild(actions);
    return wrap;
  }

  function render(){
    app.innerHTML = "";
    if(state.screen === "home") app.appendChild(renderHome());
    else if(state.screen === "quiz") app.appendChild(renderQuiz());
    else if(state.screen === "bank") app.appendChild(renderBank());
    else if(state.screen === "letters") app.appendChild(renderLetters());
    else if(state.screen === "alphabet") app.appendChild(renderAlphabet());
    else if(state.screen === "flashcards") app.appendChild(renderFlashcards());
    else if(state.screen === "flashcardsResult") app.appendChild(renderFlashcardsResult());
    else if(state.screen === "coaster") app.appendChild(renderCoaster());
    else if(state.screen === "coasterResult") app.appendChild(renderCoasterResult());
    else if(state.screen === "memory") app.appendChild(renderMemory());
    else if(state.screen === "memoryResult") app.appendChild(renderMemoryResult());
    else if(state.screen === "result") app.appendChild(renderResult());
  }

  render();
})();
</script>
</body>
</html>
